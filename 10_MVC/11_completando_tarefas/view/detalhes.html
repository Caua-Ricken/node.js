<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/detalhes.css">
    <title>detalhes</title>
</head>
<body>
    <h1>Detalhes da Tarefa</h1>
    <p><strong>Titulo:</strong> <span id="task-title"></span></p>
    <p><strong>Descrição:</strong> <span id="task-description"></span></p>
    <form id="complete-form" method="POST">
        <input type="hidden" name="done" id="done">
        <button type="submit" class="btn btn-success">
            <i class="bi bi-check2"></i>
        </button>
    </form>
    <a class="btn btn-primary" id="edit-btn"><i class="bi bi-pencil"></i></a>
    <form id="delete-form" method="POST" style="display:inline;">
    <button type="submit" class="btn btn-danger">
        <i class="bi bi-trash"></i>
    </button>
</form>
    <a href="/view">Voltar para view</a>

    <script>
        const id = window.location.pathname.split('/').pop();

        const buscarTaskDetails = async () => {
            const res = await fetch(`/tasks/all/${id}`);
            const data = await res.json();


            document.getElementById('task-title').textContent = data.title;
            document.getElementById('task-description').textContent = data.description;
            document.getElementById('edit-btn').href = `/edit/${id}`;
            document.getElementById('done').value = data.done;
            document.getElementById('complete-form').action = `/tasks/complete/${id}`;
            document.getElementById('delete-form').action = `/tasks/remove/${id}`;

            document.getElementById(`delete-form`).addEventListener('submit', function (e) {
                        const confirmado = confirm('Tem certeza que deseja deletar este usuário?');
                        if (!confirmado) {
                            e.preventDefault();
                        }
                    });   
                    
                    //confirmação da tarefa
              const title = document.getElementById('task-title');
    const description = document.getElementById('task-description');
    const button = document.getElementById('complete-btn');

    title.textContent = data.title;
    description.textContent = data.description;    
    
      if (data.done) {
        title.classList.add('completed');
        description.classList.add('completed');

        button.classList.remove('btn-success');
        button.classList.add('btn-completed');

        button.innerHTML = `<i class="bi bi-check2-all"></i>`;
    }
    //fim da confirmação
        }
        buscarTaskDetails();
       
    </script>
</body>
</html>
